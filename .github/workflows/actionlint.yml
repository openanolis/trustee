name: Actionlint
on: [pull_request]
permissions:
  contents: read
jobs:
  actionlint:
    name: Workflow Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: reviewdog/action-actionlint@v1
      with:
        # Keep lint gating independent of check-run write permissions (forks
        # and read-only workflow tokens cannot publish reviewdog reports).
        reporter: local
        filter_mode: nofilter
        fail_level: error
