name: Rust Check Suites

on:
  push:
    branches:
      - "main"
    paths:
      - 'kbs/**'
      - 'attestation-service/**'
      - 'rvps/**'
      - 'deps/**'
      - '.github/workflows/rust-check.yml'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'kbs/**'
      - 'attestation-service/**'
      - 'rvps/**'
      - 'deps/**'
      - '.github/workflows/rust-check.yml'
      - 'Cargo.toml'
  create:

env:
  CARGO_TERM_COLOR: always
  RUSTC_VERSION: 1.76.0

jobs:
  kbs-check:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'push' || 
      github.event_name == 'create'
    name: KBS Check
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: trustee_kbs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - name: Code checkout
      uses: actions/checkout@v5

    - name: Install Rust toolchain (${{ env.RUSTC_VERSION }})
      run: |
        rustup update --no-self-update ${{ env.RUSTC_VERSION }}
        rustup component add --toolchain ${{ env.RUSTC_VERSION }} rustfmt rustc clippy
        rustup target add x86_64-unknown-linux-gnu
        rustup default ${{ env.RUSTC_VERSION }}

    - name: Building dependencies installation
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libtss2-dev libudev-dev

    - name: Install TPM dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev

    - name: Install TDX dependencies
      run: |
        sudo curl -L https://download.01.org/intel-sgx/sgx_repo/ubuntu/intel-sgx-deb.key | sudo apt-key add -
        sudo echo 'deb [arch=amd64] https://download.01.org/intel-sgx/sgx_repo/ubuntu jammy main' | sudo tee /etc/apt/sources.list.d/intel-sgx.list
        sudo apt-get update
        sudo apt-get install -y libtdx-attest-dev libsgx-dcap-quote-verify-dev

    - name: KBS Build [Default]
      working-directory: kbs
      run: make TPM_PCA_PLUGIN=true

    - name: KBS Build [gRPC CoCo AS]
      working-directory: kbs
      run: make AS_FEATURE=coco-as-grpc ALIYUN=true

    - name: KBS Lint
      working-directory: kbs
      run: make lint

    - name: KBS Format
      working-directory: kbs
      run: make format

    - name: KBS Test
      working-directory: kbs
      run: make check

    - name: KBS EncryptedDb Test
      working-directory: kbs
      env:
        MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/trustee_kbs_test
      run: |
        docker exec ${{ job.services.mysql.id }} \
          mysql -uroot -e "SET GLOBAL innodb_default_row_format=COMPACT"
        make check TEST_FEATURES=encrypted-db

  as-check:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'push' || 
      github.event_name == 'create'
    name: CoCo-AS Check
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install OPA command line tool
        uses: open-policy-agent/setup-opa@950f159a49aa91f9323f36f1de81c7f6b5de9576 # v2.2.0 # v2
        with:
          version: latest

      - name: OPA policy.rego check
        run: |
          capabilities_file=$(mktemp)
          trap 'rm -f "$capabilities_file"' EXIT
          opa capabilities --current | jq \
            '.builtins += [{
              "name": "query_reference_value",
              "decl": {
                "type": "function",
                "args": [{"type": "string"}],
                "result": {"type": "any"}
              }
            }]' > "$capabilities_file"
          for file in attestation-service/src/token/*.rego;
          do
            opa check --capabilities "$capabilities_file" "$file"
          done

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install TPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev
      
      - name: Install TDX build dependencies
        run: |
          sudo curl -L https://download.01.org/intel-sgx/sgx_repo/ubuntu/intel-sgx-deb.key | sudo apt-key add -
          sudo echo 'deb [arch=amd64] https://download.01.org/intel-sgx/sgx_repo/ubuntu jammy main' | sudo tee /etc/apt/sources.list.d/intel-sgx.list
          sudo apt-get update
          sudo apt-get install -y libsgx-dcap-quote-verify-dev libsgx-dcap-default-qpl

      - name: Install Rust toolchain (${{ env.RUSTC_VERSION }})
        run: |
          rustup update --no-self-update ${{ env.RUSTC_VERSION }}
          rustup component add --toolchain ${{ env.RUSTC_VERSION }} rustfmt rustc clippy
          rustup default ${{ env.RUSTC_VERSION }}

      - name: AS Build
        working-directory: attestation-service
        run: |
          make

      - name: Run cargo test
        run: |
          sudo -E PATH="$PATH" -s cargo test -p attestation-service -p verifier

      - name: Run pure-Rust TDX verifier tests
        run: |
          sudo -E PATH="$PATH" -s cargo test -p verifier --no-default-features --features tdx-dcap-rust tdx::verify::native::tests
          sudo -E PATH="$PATH" -s cargo build -p attestation-service --bin restful-as --no-default-features --features restful-bin,all-verifier-rust,rvps-grpc

      - name: Run cargo fmt check
        run: |
          sudo -E PATH="$PATH" -s cargo fmt -p attestation-service -p verifier --check

      - name: Run rust lint check
        run: |
          sudo -E PATH="$PATH" -s cargo clippy -p attestation-service -p verifier -- -D warnings -A clippy::derive_partial_eq_without_eq

  rvps-check:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'push' || 
      github.event_name == 'create'
    name: RVPS Check
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (${{ env.RUSTC_VERSION }})
        run: |
          rustup update --no-self-update ${{ env.RUSTC_VERSION }}
          rustup component add --toolchain ${{ env.RUSTC_VERSION }} rustfmt rustc clippy
          rustup default ${{ env.RUSTC_VERSION }}

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: RVPS Build
        working-directory: rvps
        run: |
          make build

      - name: RVPS Test
        working-directory: rvps
        run: |
          cargo test --all-features

      - name: RVPS Lint Check
        working-directory: rvps
        run: |
          cargo clippy --all-features -- -D warnings

  wasm-check:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'create'
    name: Wasm Check
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (nightly-2025-07-07)
        run: |
          rustup update --no-self-update nightly-2025-07-07
          rustup component add --toolchain nightly-2025-07-07 rustfmt rustc clippy
          rustup target add wasm32-unknown-unknown --toolchain nightly-2025-07-07
          rustup default nightly-2025-07-07

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Wasm compile check
        run: |
          RUSTUP_TOOLCHAIN=nightly-2025-07-07 cargo check -p eventlog --target wasm32-unknown-unknown
          RUSTUP_TOOLCHAIN=nightly-2025-07-07 cargo check -p reference-value-provider-service --target wasm32-unknown-unknown --no-default-features  # no "fs" feature in wasm
          # The only OPA policy engine still hard-depends on tokio::fs, which is
          # unavailable on wasm32, so the attestation-service check is disabled for now.
          # RUSTUP_TOOLCHAIN=nightly-2025-07-07 cargo check -p attestation-service --target wasm32-unknown-unknown --no-default-features --features tdx-dcap-rust
          RUSTUP_TOOLCHAIN=nightly-2025-07-07 cargo check -p verifier --target wasm32-unknown-unknown --no-default-features --features tdx-dcap-rust
