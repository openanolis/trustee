# Default values for coco-kbs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

regionId:

domainName:

# Shared authoritative storage for multi-replica Trustee deployments. Use
# component images that include shared-storage support. The referenced Secret
# must be created outside this chart so credentials never become Helm values.
sharedStorage:
  enabled: false
  existingSecret: ""
  mysqlUrlKey: mysql-url
  # Trustee Gateway uses the Go MySQL DSN format, which differs from the URL
  # consumed by the Rust services.
  gatewayDsnKey: gateway-dsn
  maxConnections: 20
  minConnections: 2
  acquireTimeoutSeconds: 10
  # AS signing material must be the same read-only Secret in every replica.
  asKeysExistingSecret: ""
  tokenSignerKey: token-signer-key.pem
  challengeKey: challenge-key.pem

kbs:
  replicaCount: 1
  userKeysSecretName: kbs-auth-publickey
  tpmPca:
    # Required in shared mode so all replicas use the same TPM CA identity.
    existingSecret: ""
    signingKeyKey: ca.key
    certificateKey: ca.crt
  resourceRepository: []
#    - repoName: default
#      type: security-policy
#      secretName: kbs-resource-security-policy-default


  image:
    repository: trustee-registry.cn-hangzhou.cr.aliyuncs.com/instance/kbs
    pullPolicy: IfNotPresent
    tag: "1.7.8"

  imagePullSecrets: []

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
     allowPrivilegeEscalation: false
     capabilities:
       drop:
       - ALL
     seccompProfile:
       type: RuntimeDefault
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: LoadBalancer
    port: 8080
    loadBalancerType: intranet

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  nodeSelector: {}

  tolerations: []

  storage:
    # Used only by the legacy LocalFs resource backend. Shared storage mode
    # does not create or mount this writable PVC.
    enabled: true
    # Size of the PVC
    size: 20Gi
    # Name of the storage class to use. null for default Storage Class
    storageClass: alicloud-disk-alltype
    # Access Mode of the PVC
    accessMode: ReadWriteOnce

  aliyunKms:
    enabled: false
    # kmsIntanceId is kept for backward compatibility with older chart values.
    kmsIntanceId:
    kmsInstanceId:
    password: 
    clientKey:
    certPem:
    # Recommended AccessKey configuration path: inject credentials through
    # ALIYUN_KMS_* environment variables. Prefer accessKeyExistingSecret for
    # production deployments.
    accessKeyId:
    accessKeySecret:
    accessKeyExistingSecret:
    accessKeyIdSecretKey: access_key_id
    accessKeySecretSecretKey: access_key_secret
    regionId:
    # Private cloud KMS intranet endpoint, for example kms-intranet.<region>.<domain>.
    endpoint:
    # Use only for test environments where the private cloud KMS certificate cannot be trusted.
    insecureSkipTlsVerify: false

