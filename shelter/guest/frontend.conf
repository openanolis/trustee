# The first-boot service provisions the TLS identity before nginx starts.
server {
    listen 8082 ssl;
    server_name trustee.internal localhost;
    ssl_certificate /var/lib/trustee-shelter/identity/server.crt;
    ssl_certificate_key /var/lib/trustee-shelter/identity/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html/trustee;

    # The gateway has administrative APIs that rely on deployment-side access control.
    include /etc/nginx/trustee-admin.acl;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/api/(health|services-health)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081;
    }
    location /api/ {
        # Some Gateway routes do not authenticate administrators themselves.
        auth_request /_trustee_admin_auth;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    location = /_trustee_admin_auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8080/kbs/v0/resource-policy;
    }

    # A standard KBS client appends /kbs/v0 to its URL. Preserve its session cookie.
    location ~ ^/kbs/v0/(auth|attest)$ {
        include /etc/nginx/trustee-client.acl;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081/api$request_uri;
    }
    location ~ ^/kbs/v0/resource/[^/]+/[^/]+/[^/]+$ {
        include /etc/nginx/trustee-client.acl;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081/api$request_uri;
    }
}
